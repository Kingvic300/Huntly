[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huntly-core"
version = "0.3.0"
description = "Local core service for Huntly, an open-source desktop job-hunting assistant."
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["huntly*"]

[tool.setuptools.package-data]
huntly = ["assets/fonts/*.ttf", "assets/companies.json", "migrations/*.py", "migrations/*.ini", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
