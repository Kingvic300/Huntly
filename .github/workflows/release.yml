name: Release
# Builds installers on each platform when a version tag is pushed, and attaches them
# to a GitHub release. Binaries are not code-signed (see README, "Installing").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage,rpm
          - platform: macos-14       # Apple silicon
            bundles: dmg,app
          - platform: macos-15-intel # Intel
            bundles: dmg,app
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements-dev.txt
          python -m pip install --no-deps ./core

      - name: Core tests
        working-directory: core
        run: python -m pytest

      - name: Build the core sidecar
        shell: bash
        env:
          HUNTLY_PYTHON: python
        run: scripts/build-sidecar.sh

      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the auto-update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Huntly ${{ github.ref_name }}
          releaseBody: |
            Local, private job-hunting assistant. Everything runs on your computer.

            Download the file for your system:
            - Linux: `.deb` (Debian, Ubuntu, Kali), `.AppImage` (any distribution) or `.rpm`
            - macOS: `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
            - Windows: `-setup.exe` or `.msi`

            Already have Huntly? It updates itself: the new version downloads in the background and you'll be asked to restart.

            These builds are not code-signed yet. See the README's "Installing" section for how to open them on macOS and Windows.
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
