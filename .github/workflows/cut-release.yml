name: Cut release
# Actions tab -> Cut release -> Run workflow: sets the next version everywhere
# (scripts/release.py), commits, tags, pushes, then starts the Release build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch (0.3.4 -> 0.3.5), minor (-> 0.4.0), major (-> 1.0.0), or an exact version"
        required: true
        default: patch

permissions:
  contents: write
  actions: write   # a tag pushed with GITHUB_TOKEN starts no workflow, so start the build here

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump, commit, tag and push
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py "${{ inputs.bump }}" --push
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Start the release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.bump.outputs.tag }}"
