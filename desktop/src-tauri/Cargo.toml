[package]
name = "huntly"
version = "0.3.3"
description = "Huntly — open-source local desktop job-hunting assistant"
authors = ["Huntly contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "huntly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-shell = "=2.5.0"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-process = "=2.4.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
